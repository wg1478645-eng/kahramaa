<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>تشخيص — ACES</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal',sans-serif}
body{background:#f4f9f6;color:#0e1f18;padding:16px;max-width:720px;margin:0 auto}
h1{color:#0a5c3e;font-size:1.3rem;margin-bottom:14px}
.card{background:#fff;border:1.5px solid #b8d8cc;border-radius:12px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:700;font-size:.85rem;margin-bottom:6px;color:#0a5c3e}
input{width:100%;padding:10px;border:1.5px solid #b8d8cc;border-radius:8px;font-size:.9rem;margin-bottom:12px}
button{background:#0a5c3e;color:#fff;border:none;border-radius:8px;padding:11px 20px;font-weight:800;font-size:.9rem;cursor:pointer;width:100%}
button:hover{background:#0e7a54}
.day-box{border:2px solid #b8d8cc;border-radius:10px;padding:12px;margin-bottom:10px}
.day-box h3{font-size:1rem;margin-bottom:8px}
.row{display:flex;justify-content:space-between;padding:4px 0;font-size:.85rem;border-bottom:1px solid #eee}
.row span:first-child{color:#4a7060}
.ok{color:#166534;font-weight:800}
.no{color:#9ca3af}
.warn{color:#b83030;font-weight:800}
.mono{font-family:monospace;font-size:.78rem;word-break:break-all;background:#f4f9f6;padding:8px;border-radius:6px;margin-top:6px}
.reset-btn{background:#fef3c7;color:#92400e;border:1.5px solid #fbbf24;margin-top:8px}
</style>
</head>
<body>
<h1>🔍 أداة تشخيص الدورة</h1>

<div class="card">
  <label>معرّف الورشة (Workshop ID)</label>
  <input id="wid" placeholder="ws_xxxxx" />
  <label>معرّف المتدرب (Trainee ID)</label>
  <input id="tid" placeholder="t_xxxxx — أو اتركه فارغاً لعرض كل المتدربين" />
  <button onclick="diagnose()">🔍 فحص حالة كل الأيام</button>
</div>

<div id="result"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const app = initializeApp({
  apiKey:"AIzaSyCKmVEEC-MBwRj7oYHAWL-aVLHx5CKaSAc",
  authDomain:"kahramaa-a7443.firebaseapp.com",
  databaseURL:"https://kahramaa-a7443-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"kahramaa-a7443",
  storageBucket:"kahramaa-a7443.firebasestorage.app",
  messagingSenderId:"318396481841",
  appId:"1:318396481841:web:6a9edb2b6c13592552b010"
});
const db = getDatabase(app);
window.FB={db,ref,get,remove};
</script>

<script>
function g(p){return window.FB.get(window.FB.ref(window.FB.db,p)).then(s=>s.exists()?s.val():null);}
function del(p){return window.FB.remove(window.FB.ref(window.FB.db,p));}

async function diagnose(){
  const wid=document.getElementById('wid').value.trim();
  let tid=document.getElementById('tid').value.trim();
  const out=document.getElementById('result');
  if(!wid){out.innerHTML='<div class="card warn">أدخل معرّف الورشة</div>';return;}
  out.innerHTML='<div class="card">⏳ جارٍ الفحص...</div>';

  // إذا لم يُحدَّد متدرب، اعرض قائمة المتدربين
  if(!tid){
    const trainees=await g(`workshops/${wid}/trainees`);
    if(!trainees){out.innerHTML='<div class="card warn">لا توجد ورشة أو متدربون بهذا المعرّف</div>';return;}
    let html='<div class="card"><h3>اختر متدرباً:</h3>';
    Object.values(trainees).forEach(t=>{
      html+=`<div class="row"><span>${t.name}</span><button style="width:auto;padding:4px 12px;font-size:.78rem" onclick="document.getElementById('tid').value='${t.id}';diagnose()">فحص</button></div>`;
    });
    html+='</div>';
    out.innerHTML=html;
    return;
  }

  const tr=await g(`workshops/${wid}/trainees/${tid}`);
  let html=`<div class="card"><h2 style="color:#0a5c3e">${tr?.name||tid}</h2></div>`;

  for(const d of [1,2,3]){
    const res=await g(`workshops/${wid}/results/${tid}/${d}`);
    const att=await g(`workshops/${wid}/attendance/${tid}/${d}`);
    const req=await g(`workshops/${wid}/scan_requests/${tid}_day${d}`);
    const exam=await g(`workshops/${wid}/exam_approvals/${d}`);

    // تحديد ما سيحدث عند المسح
    let willDo;
    if(res && res.quizScore!==undefined && !res.absent) willDo='<span class="warn">⚠️ ستظهر النتيجة المحفوظة (لن يُسجَّل حضور جديد)</span>';
    else if(att==='present') willDo=exam==='open'?'<span class="ok">✅ سيدخل الاختبار مباشرة</span>':'<span class="ok">✅ سينتظر فتح الاختبار</span>';
    else if(req?.status==='pending') willDo='⏳ بانتظار موافقة المدرب';
    else if(req?.status==='approved') willDo='<span class="ok">✅ سينتظر الاختبار</span>';
    else willDo='<span class="ok">✅ سيرسل طلب حضور جديد (سليم)</span>';

    html+=`<div class="card"><div class="day-box">
      <h3>📅 اليوم ${d}</h3>
      <div class="row"><span>النتيجة (results)</span><span class="${res?'warn':'no'}">${res?(res.absent?'غائب':res.quizScore+'%'):'لا شيء'}</span></div>
      <div class="row"><span>الحضور (attendance)</span><span class="${att==='present'?'ok':'no'}">${att||'لا شيء'}</span></div>
      <div class="row"><span>طلب المسح (scan_request)</span><span class="${req?'ok':'no'}">${req?.status||'لا شيء'}</span></div>
      <div class="row"><span>حالة الاختبار (exam)</span><span class="${exam==='open'?'ok':'no'}">${exam||'مغلق'}</span></div>
      <div class="row" style="border:none;margin-top:6px"><span><strong>عند المسح:</strong></span></div>
      <div style="font-size:.85rem;margin-top:4px">${willDo}</div>
      <div class="mono">scan.html?w=${wid}&t=${tid}&d=${d}</div>
      ${(res||att||req)?`<button class="reset-btn" onclick="resetDay('${wid}','${tid}',${d})">🗑️ مسح بيانات اليوم ${d} فقط</button>`:''}
    </div></div>`;
  }

  html+=`<div class="card"><button class="reset-btn" style="background:#fde8e8;color:#b83030;border-color:#fca5a5" onclick="resetAll('${wid}','${tid}')">🔄 تصفير كل الأيام لهذا المتدرب</button></div>`;
  out.innerHTML=html;
}
window.diagnose=diagnose;

window.resetDay=async function(wid,tid,d){
  if(!confirm(`مسح كل بيانات اليوم ${d}؟`))return;
  await del(`workshops/${wid}/results/${tid}/${d}`);
  await del(`workshops/${wid}/attendance/${tid}/${d}`);
  await del(`workshops/${wid}/scan_requests/${tid}_day${d}`);
  await del(`workshops/${wid}/quiz_progress/${tid}/${d}`);
  alert(`✅ تم مسح اليوم ${d}`);
  diagnose();
}

window.resetAll=async function(wid,tid){
  if(!confirm('تصفير كل الأيام الثلاثة لهذا المتدرب؟'))return;
  for(const d of [1,2,3]){
    await del(`workshops/${wid}/results/${tid}/${d}`);
    await del(`workshops/${wid}/attendance/${tid}/${d}`);
    await del(`workshops/${wid}/scan_requests/${tid}_day${d}`);
    await del(`workshops/${wid}/quiz_progress/${tid}/${d}`);
  }
  alert('✅ تم التصفير الكامل');
  diagnose();
}
</script>
</body>
</html>
